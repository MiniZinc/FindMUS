stages:
  - build
  - trigger

variables:
  # Vendor solver locations
  Gecode_ROOT: "$CI_PROJECT_DIR/vendor/gecode"
  Gurobi_ROOT: "$CI_PROJECT_DIR/vendor/gurobi"
  CPlex_ROOT: "$CI_PROJECT_DIR/vendor/CPLEX_Studio"
  OsiCBC_ROOT: "$CI_PROJECT_DIR/vendor/cbc"

.build_template: &build_definition
  stage: build
  script:
    - curl --silent -o vendor.zip --location --header "PRIVATE-TOKEN:$ACCESS_TOKEN" "https://gitlab.com/api/v4/projects/minizinc%2Fvendor/jobs/artifacts/master/download?job=vendor:$MZNARCH"
    - unzip -q vendor.zip
    - curl --silent -o minizinc.zip --location --header "PRIVATE-TOKEN:$ACCESS_TOKEN" "https://gitlab.com/api/v4/projects/minizinc%2Fminizinc/jobs/artifacts/develop/download?job=build:$MZNARCH"
    - unzip -q minizinc.zip
    - git submodule update --init submodules/chuffed_assump
    - rm -rf build
    - mkdir -p build
    - cd build
    - cmake -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -G"$CMAKE_ARCH" -v .. -DCMAKE_BUILD_TYPE=Release -DUSE_SYSTEM_LIBMINIZINC=1 -Dlibminizinc_DIR=$PWD/../minizinc/$CMAKEDIR -DCMAKE_INSTALL_PREFIX="$CI_PROJECT_DIR/findMUS"
    - cmake --build .  --config Release
    - cmake --build .  --config Release --target install
  artifacts:
    paths:
      - findMUS/


build:linux:
  <<: *build_definition
  image: dekker1/minibuild:cpp
  variables:
    MZNARCH: "linux"
    CMAKE_ARCH: "Ninja"
    CMAKEDIR: "lib/cmake"
  tags: [linux, docker]

build:osx:
  <<: *build_definition
  variables:
    MZNARCH: "osx"
    CMAKE_ARCH: "Ninja"
    CMAKEDIR: "lib/cmake"
  tags: [osx, cmake, cpp]

build:win64:
  <<: *build_definition
  variables:
    MZNARCH: "win64"
    CMAKEDIR: "CMake"
    CMAKE_ARCH: "Visual Studio 15 2017 Win64"
  script:
    - curl --silent -o vendor.zip --location --header "PRIVATE-TOKEN:%ACCESS_TOKEN%" "https://gitlab.com/api/v4/projects/minizinc%%2Fvendor/jobs/artifacts/master/download?job=vendor:%MZNARCH%"
    - unzip -q vendor.zip
    - curl --silent -o minizinc.zip --location --header "PRIVATE-TOKEN:%ACCESS_TOKEN%" "https://gitlab.com/api/v4/projects/minizinc%%2Fminizinc/jobs/artifacts/develop/download?job=build:%MZNARCH%"
    - unzip -q minizinc.zip
    - git submodule update --init submodules/chuffed_assump
    - if not exist "build" mkdir build
    - cd build
    - cmake -G"%CMAKE_ARCH%" .. -DCMAKE_BUILD_TYPE=Release -DUSE_SYSTEM_LIBMINIZINC=1 -Dlibminizinc_DIR="%CI_PROJECT_DIR%/minizinc/%CMAKEDIR%"  -DCMAKE_INSTALL_PREFIX="%CI_PROJECT_DIR%/findMUS"
    - cmake --build .  --config Release
    - cmake --build .  --config Release --target install
  tags: [win64, cmake, cpp]

# ----------- Trigger MiniZincIDE pipeline -----------

trigger:ide:
  stage: trigger
  image: dekker1/minibuild:package
  script:
  - "curl --request POST --form token=$TRIGGER --form ref=develop https://gitlab.com/api/v4/projects/minizinc%2Fminizinc-ide/trigger/pipeline"
  dependencies: []
  tags: [linux, docker]
  only: [master]
